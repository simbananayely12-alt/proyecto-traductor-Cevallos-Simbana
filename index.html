<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor</title>
    <link rel="stylesheet" href="./fontawesome-free-6.1.2-web/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <header class="encabezado">
            <div class="encabezado_icono">
                <span class="fa-solid fa-language"> </span>
            </div>
            <h1 class="encabezado_titulo">Traductor</h1>
        </header>

        <section class="buscador">
            <form class="buscador_formulario">
                <div class="buscador_caja">
                    <input type="text" class="buscador_entrada" placeholder="Introduce una palabra">
                    <button type="submit" class="buscador_boton">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <select class="buscador_selector">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                    <option value="fr">Francés</option>
                </select>
            </form>

        </section>
    </div>

</body>
</html>
